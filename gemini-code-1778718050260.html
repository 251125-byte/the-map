<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakao Map Search Service</title>
    <style>
        /* 기본 레이아웃 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (검색창 + 리스트) */
        #sidebar {
            width: 350px;
            background-color: #f9f9f9;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .search-section {
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background-color: #fee500; /* 카카오 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #fada0a;
        }

        /* 결과 리스트 스타일 */
        #result-list {
            list-style: none;
        }

        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background-color: #efefef;
        }

        .place-name {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .place-address {
            font-size: 0.85em;
            color: #666;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 이모지 커스텀 마커용 스타일 */
        .emoji-marker {
            font-size: 30px;
            text-align: center;
            cursor: pointer;
        }

        /* 인포윈도우(팝업) 스타일 */
        .infowindow-content {
            padding: 10px;
            font-size: 13px;
            width: 180px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <div class="search-section">
            <h2 style="margin-bottom: 10px;">📍 장소 검색</h2>
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요">
                <button id="search-btn">검색</button>
            </div>
        </div>
        <ul id="result-list">
            </ul>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8ec585b7c53b6c659ceb97f1660073a7&libraries=services&autoload=false"></script>

<script>
    let map, ps, infoWindow;
    let markers = []; // 생성된 마커들을 관리할 배열

    // 1. 카카오맵 SDK가 로드된 후 실행
    kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 서울 좌표
            level: 5 // 확대 레벨 5
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places(); // 장소 검색 객체
        infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 팝업창 객체

        // 2. 현재 위치 가져오기
        getCurrentLocation();

        // 3. 이벤트 바인딩
        document.getElementById('search-btn').addEventListener('click', searchPlaces);
        document.getElementById('keyword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchPlaces();
        });
    });

    // 현재 위치를 지도의 중심으로 설정
    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const moveLatLng = new kakao.maps.LatLng(lat, lon);
                
                map.setCenter(moveLatLng); // 지도 중심 이동
                
                // 현재 위치 표시용 이모지 마커
                const currentMarkerContent = '<div class="emoji-marker">🏠</div>';
                const currentMarker = new kakao.maps.CustomOverlay({
                    position: moveLatLng,
                    content: currentMarkerContent
                });
                currentMarker.setMap(map);
            }, () => {
                alert("위치 권한을 가져올 수 없어 기본 위치로 표시합니다.");
            });
        }
    }

    // 키워드로 장소 검색
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.trim()) {
            alert("검색어를 입력해주세요.");
            return;
        }

        // 카카오 장소 검색 실행
        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 검색 결과 콜백 함수
    function placesSearchCB(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert("검색 결과가 없습니다.");
        } else {
            alert("검색 중 오류가 발생했습니다.");
        }
    }

    // 검색 결과 리스트와 마커 표시
    function displayPlaces(places) {
        const listEl = document.getElementById('result-list');
        const bounds = new kakao.maps.LatLngBounds();

        // 이전 결과 삭제
        clearResults();
        listEl.innerHTML = '';

        places.forEach((place) => {
            const placePosition = new kakao.maps.LatLng(place.y, place.x);
            
            // 1. 마커 생성 (이모지 마커)
            const markerContent = `<div class="emoji-marker">📍</div>`;
            const marker = new kakao.maps.CustomOverlay({
                position: placePosition,
                content: markerContent
            });
            marker.setMap(map);
            markers.push(marker); // 배열에 추가

            // 2. 지도 범위 확장을 위한 좌표 추가
            bounds.extend(placePosition);

            // 3. 왼쪽 리스트 아이템 생성
            const itemEl = document.createElement('li');
            itemEl.className = 'result-item';
            itemEl.innerHTML = `
                <span class="place-name">${place.place_name}</span>
                <span class="place-address">${place.road_address_name || place.address_name}</span>
            `;

            // 리스트 및 마커 클릭 이벤트
            const showPopup = () => {
                const content = `
                    <div class="infowindow-content">
                        <strong>${place.place_name}</strong><br>
                        ${place.address_name}
                    </div>
                `;
                infoWindow.setContent(content);
                infoWindow.setPosition(placePosition);
                infoWindow.open(map);
                map.panTo(placePosition);
            };

            itemEl.onclick = showPopup;
            // CustomOverlay는 이벤트를 직접 걸기 위해 DOM 조작이 필요하지만, 여기서는 리스트 클릭 위주로 구현했습니다.

            listEl.appendChild(itemEl);
        });

        // 4. 검색된 장소들이 모두 보이도록 지도 범위 조정
        map.setBounds(bounds);
    }

    // 기존 검색 마커와 팝업 제거
    function clearResults() {
        markers.forEach(marker => marker.setMap(null));
        markers = [];
        infoWindow.close();
    }
</script>

</body>
</html>
