<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* 왼쪽 사이드바 */
        #sidebar {
            width: 350px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .search-area {
            padding: 20px;
            background: #fee500; /* 카카오 테마색 */
        }

        .search-box {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 검색 결과 리스트 */
        #result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item:hover {
            background-color: #f1f1f1;
        }

        .item strong {
            display: block;
            color: #333;
            font-size: 16px;
        }

        .item span {
            font-size: 13px;
            color: #666;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 커스텀 오버레이/인포윈도우 스타일 */
        .info-window {
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sidebar">
        <div class="search-area">
            <h2 style="margin-bottom: 10px;">📍 장소 검색</h2>
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소, 주소 검색">
                <button id="search-btn">검색</button>
            </div>
        </div>
        <ul id="result-list">
            </ul>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8ec585b7c53b6c659ceb97f1660073a7&libraries=services"></script>

<script>
    // 1. 지도 초기 설정
    const mapContainer = document.getElementById('map');
    const mapOption = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 중심좌표
        level: 5
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // 2. 전역 변수 설정
    const ps = new kakao.maps.services.Places(); // 장소 검색 객체
    const infowindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 정보 창 객체
    let markers = []; // 생성된 마커를 담을 배열 (삭제를 위함)

    // 3. 현재 위치 권한 요청 및 지도 이동
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const locPosition = new kakao.maps.LatLng(lat, lon);
            map.setCenter(locPosition);
        });
    }

    // 4. 검색 버튼 및 엔터키 이벤트 바인딩
    document.getElementById('search-btn').addEventListener('click', searchPlaces);
    document.getElementById('keyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchPlaces();
    });

    // 5. 장소 검색 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('키워드를 입력해주세요!');
            return;
        }

        // 카카오 장소 검색 API 호출
        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 6. 검색 결과 콜백 함수
    function placesSearchCB(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data); // 검색 성공 시 결과 표시
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 없습니다.');
        } else {
            alert('오류가 발생했습니다.');
        }
    }

    // 7. 결과 표시 (마커 + 리스트)
    function displayPlaces(places) {
        const listEl = document.getElementById('result-list');
        const bounds = new kakao.maps.LatLngBounds();

        // 기존 마커와 리스트 초기화
        removeMarkers();
        listEl.innerHTML = '';

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            // 마커 생성 (이모지 사용을 위해 CustomOverlay 활용 가능하나, 여기서는 기본 마커를 사용하고 클릭 시 팝업에 집중)
            const marker = addMarker(placePosition);
            
            // 지도 범위 확장을 위해 좌표 추가
            bounds.extend(placePosition);

            // 리스트 아이템 생성
            const itemEl = createListItem(i, places[i]);
            
            // 마커와 리스트 아이템에 이벤트 등록
            (function(marker, title, address) {
                // 지도 마커 클릭 이벤트
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfoWindow(marker, title, address);
                });

                // 리스트 아이템 클릭 이벤트
                itemEl.onclick = function() {
                    displayInfoWindow(marker, title, address);
                    map.panTo(placePosition); // 해당 위치로 부드럽게 이동
                };
            })(marker, places[i].place_name, places[i].address_name);

            listEl.appendChild(itemEl);
        }

        // 검색된 장소들이 모두 보이도록 지도 영역 조정
        map.setBounds(bounds);
    }

    // 8. 마커 생성 함수
    function addMarker(position) {
        const marker = new kakao.maps.Marker({
            position: position
        });
        marker.setMap(map);
        markers.push(marker); // 배열에 저장하여 나중에 지울 수 있게 함
        return marker;
    }

    // 9. 기존 마커 제거 함수
    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
        infowindow.close(); // 팝업창도 닫기
    }

    // 10. 리스트 아이템 HTML 생성 함수
    function createListItem(index, place) {
        const el = document.createElement('li');
        el.className = 'item';
        el.innerHTML = `
            <strong>${place.place_name}</strong>
            <span>${place.road_address_name ? place.road_address_name : place.address_name}</span>
        `;
        return el;
    }

    // 11. 인포윈도우(팝업) 표시 함수
    function displayInfoWindow(marker, title, address) {
        const content = `
            <div class="info-window">
                <strong>📍 ${title}</strong><br>
                <span>${address}</span>
            </div>
        `;
        infowindow.setContent(content);
        infowindow.open(map, marker);
    }
</script>

</body>
</html>
